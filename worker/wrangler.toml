name = "ball-vs-ball-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# Override in production using: npx wrangler secret put JWT_SECRET
JWT_SECRET = "ball_vs_ball_dev_secret_change_in_production"
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "ball-vs-ball-db"
# Replace with the database_id output by: npx wrangler d1 create ball-vs-ball-db
database_id = "YOUR_D1_DATABASE_ID"

[durable_objects]
bindings = [
  { name = "MATCHMAKER", class_name = "MatchmakerDO" },
  { name = "GAME_ROOM", class_name = "GameRoomDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchmakerDO", "GameRoomDO"]
